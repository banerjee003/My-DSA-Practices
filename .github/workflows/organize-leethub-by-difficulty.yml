name: Organize LeetHub Problems by Difficulty

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move newly pushed LeetHub problems
        run: python3 .github/scripts/organize_leethub_by_difficulty.py

      - name: Commit and push if changes exist
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: organize LeetHub problems by difficulty"
            git push
          else
            echo "No changes to commit"
          fi
